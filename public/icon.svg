<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14171F"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="120" y1="180" x2="392" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="120" y1="260" x2="340" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="120" y1="340" x2="280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="90" y="140" width="332" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Construction / Blueprint Grid Pattern Accent -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="2">
    <line x1="64" y1="64" x2="448" y2="64"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="192" x2="448" y2="192"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="64" y1="448" x2="448" y2="448"/>
    <line x1="64" y1="64" x2="64" y2="448"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="192" y1="64" x2="192" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="320" y1="64" x2="320" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="448" y1="64" x2="448" y2="448"/>
  </g>

  <!-- Layered Architecture Bars (Download & Construction Metaphor) -->
  <g filter="url(#shadow)">
    <!-- Top Layer (Primary) -->
    <rect x="120" y="156" width="272" height="48" rx="24" fill="url(#primaryGrad)"/>
    <circle cx="144" cy="180" r="10" fill="#FFFFFF" fill-opacity="0.9"/>
    
    <!-- Middle Layer (Cyan) -->
    <rect x="120" y="236" width="200" height="48" rx="24" fill="url(#cyanGrad)"/>
    <circle cx="144" cy="260" r="10" fill="#FFFFFF" fill-opacity="0.9"/>
    
    <!-- Bottom Layer (Emerald) -->
    <rect x="120" y="316" width="136" height="48" rx="24" fill="url(#greenGrad)"/>
    <circle cx="144" cy="340" r="10" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
